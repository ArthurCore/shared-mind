name: Apply product lint cleanup

on:
  push:
    branches:
      - agent/product-roadmap-implementation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: agent/product-roadmap-implementation
      - name: Apply exact lint cleanup and verify
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          READY=.github/apply-product-lint-cleanup.ready
          WORKFLOW=.github/workflows/apply-product-lint-cleanup.yml
          if [ ! -f "$READY" ]; then
            echo "Cleanup is not marked ready; nothing to apply."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/shared_mind/memory_views.py": [
                  (
                      '        source_by_revision = {\n            item["source_revision"]["revision_id"]: item for item in state["sources"]\n        }\n',
                      "",
                  )
              ],
              "src/shared_mind/product.py": [
                  (
                      "from .service import OperationResult, WorkspaceService\n",
                      "from .service import WorkspaceService\n",
                  )
              ],
              "src/shared_mind/product_ingest.py": [
                  ("import os\n", ""),
                  ("import shutil\n", ""),
                  ("from .kernel import Kernel\n", ""),
                  (
                      "from .product_store import ProductStore, ProductStoreError, utc_now\n",
                      "from .product_store import ProductStore, utc_now\n",
                  ),
              ],
              "src/shared_mind/skills.py": [
                  ("import io\n", ""),
                  (
                      "from .product_store import ProductStore, ProductStoreError, utc_now\n",
                      "from .product_store import ProductStore, utc_now\n",
                  ),
              ],
              "src/shared_mind/web_control.py": [
                  (
                      "from .workspace import Workspace, WorkspaceError\n",
                      "from .workspace import Workspace\n",
                  )
              ],
          }
          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"expected lint target missing in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm -f "$READY" "$WORKFLOW"
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_memory_views_product.py' -v
          python -m unittest discover -s tests -p 'test_product_ingest.py' -v
          python -m unittest discover -s tests -p 'test_shared_skills.py' -v
          python -m unittest discover -s tests -p 'test_product_interfaces.py' -v
          git diff --check
          git config user.name "Shared Mind automation"
          git config user.email "40878218+ArthurCore@users.noreply.github.com"
          git add -A
          git commit -m "fix product lint findings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
