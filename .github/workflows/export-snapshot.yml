name: Apply implementation payload

on:
  push:
    branches:
      - agent/product-roadmap-implementation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: agent/product-roadmap-implementation
      - name: Apply verified payload and publish commit
        env:
          EXPECTED_SHA256: 8545856dd9842455ba2ccc50bb214b18d1a93484efbd35ceaf61a375e59fc1ef
          EXPECTED_PARTS: "22"
        run: |
          set -euo pipefail
          READY=.github/product-implementation-payload.ready
          if [ ! -f "$READY" ]; then
            echo "Implementation payload is not marked ready; nothing to apply."
            exit 0
          fi
          mapfile -t PARTS < <(find .github -maxdepth 1 -type f -name 'product-implementation-payload.part-*' | sort)
          if [ "${#PARTS[@]}" -ne "$EXPECTED_PARTS" ]; then
            echo "Expected $EXPECTED_PARTS payload parts, found ${#PARTS[@]}." >&2
            exit 1
          fi
          ENCODED="$RUNNER_TEMP/product-implementation.tar.xz.b64"
          ARCHIVE="$RUNNER_TEMP/product-implementation.tar.xz"
          STAGING="$RUNNER_TEMP/product-implementation"
          cat "${PARTS[@]}" > "$ENCODED"
          base64 --decode "$ENCODED" > "$ARCHIVE"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --strict
          mkdir -p "$STAGING"
          python - "$ARCHIVE" "$STAGING" "$GITHUB_WORKSPACE" <<'PY'
          from __future__ import annotations

          import json
          import shutil
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          archive_path = Path(sys.argv[1])
          staging = Path(sys.argv[2])
          workspace = Path(sys.argv[3]).resolve()
          seen: set[str] = set()
          with tarfile.open(archive_path, "r:xz") as archive:
              members = archive.getmembers()
              if not 1 <= len(members) <= 100:
                  raise SystemExit("unexpected payload member count")
              for member in members:
                  logical = PurePosixPath(member.name)
                  if (
                      logical.is_absolute()
                      or ".." in logical.parts
                      or member.name in seen
                      or member.issym()
                      or member.islnk()
                      or not member.isfile()
                      or member.size > 2_000_000
                  ):
                      raise SystemExit(f"unsafe payload member: {member.name}")
                  seen.add(member.name)
              archive.extractall(staging, filter="data")

          manifest = json.loads((staging / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("format") != "shared-mind-implementation-payload@1":
              raise SystemExit("unsupported implementation payload")
          files = manifest.get("files")
          deletions = manifest.get("deletions")
          if not isinstance(files, list) or not isinstance(deletions, list):
              raise SystemExit("invalid payload manifest")
          expected_members = {"manifest.json", *(f"files/{item}" for item in files)}
          if expected_members != seen:
              raise SystemExit("payload manifest/member mismatch")

          def checked_relative(value: object) -> PurePosixPath:
              if not isinstance(value, str):
                  raise SystemExit("payload path must be text")
              path = PurePosixPath(value)
              if path.is_absolute() or ".." in path.parts or not path.parts:
                  raise SystemExit(f"unsafe payload path: {value!r}")
              if path.parts[:2] == (".github", "workflows") or path.parts[0] == ".git":
                  raise SystemExit(f"workflow/git path is outside payload scope: {value}")
              return path

          for value in files:
              relative = checked_relative(value)
              source = staging / "files" / Path(*relative.parts)
              destination = workspace / Path(*relative.parts)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          for value in deletions:
              relative = checked_relative(value)
              destination = workspace / Path(*relative.parts)
              if destination.is_dir():
                  shutil.rmtree(destination)
              elif destination.exists():
                  destination.unlink()
          PY
          rm -f "$READY" "${PARTS[@]}"
          git diff --check
          git config user.name "Shared Mind automation"
          git config user.email "40878218+ArthurCore@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Payload produced no changes."
            exit 0
          fi
          git commit -m "implement shared memory product roadmap"
          git push origin "HEAD:${GITHUB_REF_NAME}"
