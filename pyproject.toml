[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-mind-kernel"
version = "0.1.0"
description = "Deterministic epistemic transaction kernel"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/shared-mind/contracts" = ["contracts/shared-mind-kernel.schema.v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
