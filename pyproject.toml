[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-mind-kernel"
version = "0.2.0"
description = "Local-first, replayable external memory for AI work continuity"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
quality = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "pip-audit>=2.7,<3",
  "ruff>=0.9,<1",
  "twine>=6,<7",
]

[project.scripts]
shared-mind = "shared_mind.cli:main"
shared-mind-mcp = "shared_mind.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/shared-mind/contracts" = [
  "contracts/shared-mind-kernel.schema.v1.json",
  "contracts/shared-mind-read.schema.v1.json",
  "contracts/atlas-predicate-registry.v1.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["shared_mind"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
